name: CI

on:
  push:
    branches: [main]
  # No base-branch filter. Work here is reviewed as stacked pull requests, whose
  # base is the layer below rather than main. Filtering on main would leave every
  # layer except the bottom one untested.
  pull_request:

# Builds, tests and lints only; nothing here writes to the repo.
permissions:
  contents: read

# Every run compiles from scratch on an empty runner, so a superseded run has
# nothing worth finishing. A second push to a branch cancels the first run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the token; drop it from .git/config.
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      # SwiftLint runs before the build. It costs seconds, and going first means
      # a broken build still reports lint findings.
      #
      # mise pins the version in mise.toml, so a run lints with what you get
      # locally. `brew install swiftlint` resolved a floating version and warned
      # about the runner image's untrusted aws/tap on every run.
      - name: Install SwiftLint
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # .swiftlint.yml decides what blocks here. SwiftLint exits non-zero for
      # error-severity violations only, so this step fails on those and reports
      # the warnings as annotations.
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      # One compile does the work two macOS jobs used to do. The shared scheme
      # marks EyeBreak.app buildForTesting, so `test` produces the same Release
      # binary the old separate build job produced, then runs the suite on it.
      #
      # `shell: bash` runs with -eo pipefail. Without it the pipe into tee would
      # hide a failing test behind tee's exit status.
      - name: Build and test
        shell: bash
        run: |
          xcodebuild test \
            -project EyeBreak.xcodeproj \
            -scheme EyeBreak \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log

      # Advisory. This reads the log the step above already wrote, where it used
      # to be a third full clean build. It runs even when the build fails, which
      # is when the surrounding lines matter most.
      #
      # The pattern anchors on file:line:column so it reports compiler
      # diagnostics only. A bare "warning:" also matched the swiftc invocations,
      # which are thousands of characters each, and a toolchain notice about
      # AppIntents that no source change can clear.
      - name: Report warnings
        if: always()
        run: |
          grep -E -A 3 '^[^ ]+:[0-9]+:[0-9]+: warning:' build.log \
            || echo "No warnings found! 🎉"

  checks:
    name: Repo Checks
    # Two shell commands. Neither needs a macOS runner.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the token; drop it from .git/config.
          persist-credentials: false

      - name: Check for TODO/FIXME
        run: grep -rn "TODO\|FIXME" EyeBreak/ || echo "No TODO/FIXME found"

      # The old form could not fail: `find -exec test -x` exits 0 whether or not
      # anything matched, so a script that lost its execute bit passed silently.
      # docs/PUBLISHING.md invokes these as ./scripts/foo.sh, so a missing bit is
      # a real break.
      - name: Check script permissions
        run: |
          not_executable="$(find scripts -name '*.sh' -type f ! -perm -u+x)"
          if [ -n "$not_executable" ]; then
            echo "These scripts are not executable:"
            echo "$not_executable"
            exit 1
          fi
          echo "Every script under scripts/ is executable"
