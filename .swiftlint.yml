# SwiftLint runs its whole default rule set. Nothing is disabled.
#
# Eight rules were disabled while this repo rebased onto upstream, because a
# reformat would have conflicted on every sync. Issue #43 turned them on and
# fixed the findings. The thresholds below are the only place this file relaxes
# a default.
#
# Severity decides whether CI blocks. `swiftlint lint` exits non-zero for
# error-severity violations only, so errors fail the build while warnings stay
# advisory annotations on the pull request.

# Without this SwiftLint walks the whole working directory, which locally
# includes whatever dev-install.sh left under build/. A clean CI checkout has no
# build/, so local and CI runs would disagree.
included:
  - EyeBreak
  - EyeBreakTests

line_length:
  # SwiftUI modifier chains and long user-facing strings pass the default 120
  # routinely. 200 still catches a line nobody can read.
  warning: 200
  error: 300

identifier_name:
  # Color components, coordinates and loop counters are idiomatic Swift, and
  # `id` is the name Identifiable requires. The default three-character minimum
  # rejects every one of them.
  excluded:
    - a
    - b
    - g
    - i
    - id
    - r
    - up
    - x
    - y
